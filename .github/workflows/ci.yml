name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad-y-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: incidentes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d incidentes_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Dependencias
        run: uv sync --locked

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: bandit
        run: uv run bandit -c pyproject.toml -r app

      - name: pip-audit
        run: uv run pip-audit --strict

      - name: pytest (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/incidentes_test
        run: uv run pytest --cov --cov-report=term-missing

      # El señuelo no tiene dependencias propias: se valida con las herramientas del backend
      - name: ruff y pytest (señuelo)
        run: |
          uv run ruff check ../senuelo
          uv run ruff format --check ../senuelo
          uv run pytest ../senuelo

  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: calidad-y-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build de la imagen
        run: docker build -t api-incidentes:ci ./backend

      - name: La imagen no corre como root
        run: test "$(docker run --rm --entrypoint id api-incidentes:ci -u)" != "0"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias
        run: npm ci --no-fund

      - name: npm audit (dependencias de runtime)
        run: npm audit --omit=dev --audit-level=high

      - name: Tests unitarios (Vitest)
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build

      - name: Build de la imagen
        run: docker build -t web-incidentes:ci .

      - name: La imagen no corre como root
        run: test "$(docker run --rm --entrypoint id web-incidentes:ci -u)" != "0"

  senuelo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: calidad-y-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build de la imagen
        run: docker build -t senuelo-incidentes:ci ./senuelo

      - name: La imagen no corre como root
        run: test "$(docker run --rm --entrypoint id senuelo-incidentes:ci -u)" != "0"

  # Punta a punta: navegador real -> front de producción con la CSP de nginx -> API real con su
  # auth propia (JWT + cookie de refresco) -> BD SQLite desechable. No toca ningún servicio externo.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [calidad-y-tests, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Dependencias de la API
        working-directory: backend
        run: uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias del front
        run: npm ci --no-fund

      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npx playwright test

      - name: Informe y logs si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # Despliegue continuo: solo llega a producción lo que ha pasado todos los controles.
  # El auto-deploy de Dokploy está desactivado; el único disparador es este job.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [calidad-y-tests, imagen, frontend, senuelo, e2e]
    environment: production
    # Un despliegue a medias no se cancela porque llegue otro push.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Desplegar el compose en Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "$DOKPLOY_URL/api/compose.deploy" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"composeId\": \"$DOKPLOY_COMPOSE_ID\", \"title\": \"CI ${GITHUB_SHA::7}\"}"
