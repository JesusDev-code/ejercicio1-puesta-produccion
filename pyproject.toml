[project]
name = "api-incidentes"
version = "0.1.0"
description = "API REST para la gestión de incidentes de ciberseguridad"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.142.4",
    "firebase-admin>=7.7.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Migraciones autogeneradas: las cadenas SQL de los CHECK no se pueden partir
"alembic/versions/**" = ["E501"]
"senuelo/**" = ["S311", "S104", "S310"]
"senuelo/test_*.py" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["app"]
# El motor clásico (ctrace) pierde líneas tras los `await` en Python 3.12
core = "sysmon"
omit = ["app/cli.py"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
