# Producción (Dokploy). En local, docker compose fusiona además docker-compose.override.yml.
# Sin secretos no arranca nada: Postgres rechaza la contraseña vacía y la API un JWT_SECRETO corto.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incidentes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-incidentes}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    # Sin "ports": la base de datos solo es alcanzable desde la red interna del compose
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENTORNO: ${ENTORNO:-produccion}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-incidentes}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-incidentes}
      JWT_SECRETO: ${JWT_SECRETO:-}
      CORS_ORIGENES: ${CORS_ORIGENES:-}
      # Traefik publica la API bajo /api del mismo dominio que el front (strip path)
      COOKIE_REFRESCO_RUTA: ${COOKIE_REFRESCO_RUTA:-/api/auth/web}
      INGESTA_TOKEN: ${INGESTA_TOKEN:-}
      API_PREFIJO: ${API_PREFIJO:-/api}
      # Cifra los secretos TOTP. Vacía o corta, la API no arranca. Distinta de JWT_SECRETO
      MFA_CLAVE: ${MFA_CLAVE:-}
      MFA_OBLIGATORIO_PERSONAL: ${MFA_OBLIGATORIO_PERSONAL:-true}
      # Login con Google y GitHub: cada proveedor se activa solo si tiene id y secreto
      URL_PUBLICA: ${URL_PUBLICA:-}
      COOKIE_OAUTH_RUTA: ${COOKIE_OAUTH_RUTA:-/api/auth/oauth}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # La api no publica puerto: solo le llega tráfico de Traefik, así que se fía de su X-Forwarded-For
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Señuelo (honeypot de registro): expuesto a internet, NO vulnerable. Recibe sondeos y los
  # manda a la API. Dominio propio en Dokploy (host distinto al de la web).
  senuelo:
    build: ./senuelo
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      MODO: senuelo
      API_URL: http://api:8000
      INGESTA_TOKEN: ${INGESTA_TOKEN:-}
      # Cliente al que protege este sensor (código de /empresas); vacío = del propio MSSP
      EMPRESA: ${EMPRESA_SENUELO:-hotel-mirador}
    expose:
      - "8000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Generador de eventos de DEMOSTRACIÓN: telemetría de mentira para el panel. Sin puerto.
  generador:
    build: ./senuelo
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      MODO: generador
      API_URL: http://api:8000
      INGESTA_TOKEN: ${INGESTA_TOKEN:-}
      # Reparte los eventos de demo entre estos clientes (códigos de /empresas)
      EMPRESAS: ${EMPRESAS_GENERADOR:-transportes-ibarra,clinica-solana,hotel-mirador}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Frontend Angular: solo estáticos. En Dokploy, dos dominios con el MISMO host:
  #   host /api -> api:8000 con "Strip Path"   ·   host / -> web:8080
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # pg_dump periódico a un volumen propio, con retención. Dokploy no respalda una BD que vive
  # dentro de un compose. Mismo VPS: protege de borrados y corrupción, no de perder la máquina.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-incidentes}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATABASE: ${POSTGRES_DB:-incidentes}
      BACKUP_INTERVALO_SEGUNDOS: ${BACKUP_INTERVALO_SEGUNDOS:-86400}
      BACKUP_RETENCION_DIAS: ${BACKUP_RETENCION_DIAS:-7}
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        while true; do
          f="/backups/$${PGDATABASE}_$$(date -u +%Y%m%dT%H%M%SZ).dump"
          if pg_dump --format=custom --file="$$f.tmp"; then
            mv "$$f.tmp" "$$f" && echo "backup ok: $$f"
          else
            rm -f "$$f.tmp" && echo "backup FALLIDO" >&2
          fi
          find /backups -name '*.dump' -mtime +"$${BACKUP_RETENCION_DIAS}" -delete
          sleep "$${BACKUP_INTERVALO_SEGUNDOS}"
        done
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  datos-postgres:
  backups:
