# Solo local: `docker compose up` lo fusiona automáticamente. Dokploy no lo usa.
#
# Trae secretos de DESARROLLO para que el proyecto arranque sin configurar nada. Son públicos:
# no protegen nada y nunca deben llegar a producción. Si existe un .env, sus valores mandan.
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desarrollo-local-no-usar-en-produccion}

  api:
    environment:
      ENTORNO: desarrollo
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-incidentes}:${POSTGRES_PASSWORD:-desarrollo-local-no-usar-en-produccion}@db:5432/${POSTGRES_DB:-incidentes}
      FIREBASE_CREDENCIALES: ${FIREBASE_CREDENCIALES:-}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # Sin proxy delante: no se confía en cabeceras X-Forwarded-*
      FORWARDED_ALLOW_IPS: 127.0.0.1
      # En local el front va con `npm start`, cuyo proxy ya reescribe el Path de la cookie
      INGESTA_TOKEN: ${INGESTA_TOKEN:-ingesta-de-desarrollo-local-no-usar-en-produccion}
    ports:
      - "127.0.0.1:${API_PUERTO:-8000}:8000"

  backup:
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-desarrollo-local-no-usar-en-produccion}

  senuelo:
    environment:
      INGESTA_TOKEN: ${INGESTA_TOKEN:-ingesta-de-desarrollo-local-no-usar-en-produccion}

  generador:
    environment:
      INGESTA_TOKEN: ${INGESTA_TOKEN:-ingesta-de-desarrollo-local-no-usar-en-produccion}
