# Solo estáticos. El enrutado lo hace Traefik (Dokploy) en el mismo dominio:
#   /api/*  -> servicio api  (con "strip path": la API recibe /incidentes, /auth/...)
#   /*      -> este servicio
# Mismo origen: sin CORS, y la cookie de refresco es de primera parte (SameSite=Strict).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Nonce de la CSP: $request_id son 128 bits aleatorios, distintos en cada respuesta
    set $nonce $request_id;

    # Ficheros con hash en el nombre: inmutables
    location ~ ^/(media/|(chunk|main|styles|polyfills)-[A-Z0-9]+\.(js|css)$) {
        include /etc/nginx/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/cabeceras-seguridad.conf;
        add_header Cache-Control "no-store" always;
        sub_filter_once off;
        sub_filter CSP_NONCE $nonce;
    }

    # Rutas de la SPA (/incidentes/42...): todas devuelven index.html
    location / {
        include /etc/nginx/cabeceras-seguridad.conf;
        try_files $uri /index.html;
    }
}
